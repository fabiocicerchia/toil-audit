site_name: toil-audit
site_description: Quantifies the cost of manual CI/CD pipeline babysitting, in euros.
repo_url: https://github.com/fabiocicerchia/toil-audit
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
