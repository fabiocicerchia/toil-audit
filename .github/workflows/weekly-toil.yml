name: weekly toil report

# The audit otherwise runs when someone remembers, which is the manual
# babysitting this tool exists to price.
#
# Monday morning on purpose: the week's number lands before anyone has decided
# what to work on, and a report that arrives on Friday afternoon is read on
# Monday anyway, by which time it describes the week before last.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:
    inputs:
      repos:
        description: Space-separated owner/name list to audit (defaults to this repo)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-toil
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Last week's figures, so the report can say which way the number moved.
      # A miss is fine — delta_line says "first report" rather than inventing a
      # comparison.
      - name: Restore last week's figures
        id: state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: .toilaudit-weekly.json
          key: toil-weekly-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            toil-weekly-${{ github.repository }}-

      - name: Audit and post
        env:
          # Both are secrets. The token is read by the ingest path and the
          # webhook by the delivery path; neither is ever passed as a flag,
          # because a flag is visible in `ps` and in the command line the
          # runner prints into this log.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOIL_AUDIT_SLACK_WEBHOOK: ${{ secrets.TOIL_AUDIT_SLACK_WEBHOOK }}
          REPOS: ${{ inputs.repos || github.repository }}
        run: |
          set -euo pipefail
          mkdir -p reports
          failed=0
          for repo in $REPOS; do
            name="${repo//\//-}"
            # The report is written first and kept as an artifact regardless of
            # what delivery does.
            python -m toilaudit --repo "$repo" --since "$(date -u -d '7 days ago' +%F)" \
              --out "reports/${name}.md" --slack "$repo" || failed=1
          done
          exit "$failed"

      # Always: a failed post must not lose the week's report, which is the
      # whole point of writing it before sending.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toil-reports
          path: reports/
          retention-days: 90

      - name: Save this week's figures
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: .toilaudit-weekly.json
          key: toil-weekly-${{ github.repository }}-${{ github.run_id }}
