# Domain vocabulary the typos dictionary mistakes for misspellings.

[default]
# Abbreviated git SHAs in release-please's CHANGELOG.md links: `bb8dbe0` reads
# as the typo `dbe`. CHANGELOG.md is generated, so the SHAs cannot be reworded.
extend-ignore-re = ['\b[0-9a-f]{7,40}\b']

[files]
# Fixture commit SHAs: hex strings that happen to contain dbe, caf, ede, ba.
extend-exclude = ["data/sample_runs.json"]
